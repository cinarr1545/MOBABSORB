name: Build Forge 1.20.1 Mod JAR

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build Mod JAR
        run: gradle build --no-daemon

      - name: Upload Compiled Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: mobabsorb-1.20.1-forge-jar
          path: build/libs/mobabsorb-*.jar
